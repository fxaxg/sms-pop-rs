[workspace]
resolver = "2"
members = [
    "crates/smspop-core",
    "crates/smspop-ble",
    "crates/smspop-uia",
    "src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "把 iPhone 的通知和验证码接到 Windows 上"

[workspace.dependencies]
windows = "0.62"
pollster = "0.4"
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
